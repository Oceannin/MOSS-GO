name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            build-requirements.lock
      - run: >-
          python -m pip install --require-hashes --only-binary=:all: -r build-requirements.lock
      - run: python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
      - run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - run: python scripts/check_archives.py dist
      - run: python scripts/check_install.py --wheel-dir dist --work-dir .local/installed-check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run format:check
